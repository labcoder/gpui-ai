[package]
name = "gallery"
description = "Component gallery for gpui-ai — one story per component."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gallery"

[[bin]]
name = "gallery-performance"
path = "src/performance_main.rs"
required-features = ["performance"]

[[bin]]
name = "gallery-catalog-scan"
path = "src/catalog_main.rs"
required-features = ["performance"]

[features]
performance = ["gpui/profiler", "dep:windows-sys"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-ai.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
