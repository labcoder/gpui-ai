[package]
name = "gallery"
description = "Component gallery for mighty-gpui — one story per component."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gallery"

[[bin]]
name = "gallery-performance"
path = "src/performance_main.rs"
required-features = ["performance"]

[features]
performance = ["gpui/profiler"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
mighty-gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
