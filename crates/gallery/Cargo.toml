[package]
name = "gallery"
description = "Component gallery for gpui-ai — one story per component."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gallery"

[[bin]]
name = "gallery-performance"
path = "src/performance_main.rs"
required-features = ["performance"]

[[bin]]
name = "gallery-catalog-scan"
path = "src/catalog_main.rs"
required-features = ["performance"]

[features]
performance = ["gpui/profiler", "dep:windows-sys"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# Syntax highlighting for Markdown code fences in CodeBlock stories. Without
# this feature upstream's TextView falls back to an inert highlighter and
# renders fenced code as a single flat color. (json is bundled in the base
# "tree-sitter" feature, so it needs no separate entry.)
gpui-component = { workspace = true, features = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-python",
    "tree-sitter-markdown",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
] }
gpui-component-assets.workspace = true
gpui-ai.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
