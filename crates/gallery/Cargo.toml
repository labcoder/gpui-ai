[package]
name = "gallery"
description = "Component gallery for gpui-ai — one story per component."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gallery"

[[bin]]
name = "gallery-performance"
path = "src/performance_main.rs"
required-features = ["performance"]

[[bin]]
name = "gallery-catalog-scan"
path = "src/catalog_main.rs"
required-features = ["performance"]

[[bin]]
name = "gallery-catalog-export"
path = "src/catalog_export_main.rs"
required-features = ["export"]

[features]
performance = ["gpui/profiler", "dep:windows-sys"]
# Kept behind a feature so serde_json stays out of the shipped gallery and its
# WASM build; only the catalog exporter needs it.
export = ["dep:serde_json"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-ai.workspace = true
gpui-base.workspace = true
serde_json = { version = "1", optional = true }

# Syntax highlighting for Markdown code fences in native CodeBlock stories.
# Upstream declares every tree-sitter dependency as native-only, so enabling
# these features for wasm32 makes gpui-component compile code whose dependency
# graph is intentionally absent. The browser gallery uses TextView's fallback
# highlighter until upstream makes the language stack WASM-compatible. JSON is
# bundled in the base `tree-sitter` feature, so it needs no separate entry.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-component = { workspace = true, features = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-python",
    "tree-sitter-markdown",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
serde_json = "1"
