<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>gpui-ai example</title>
    <script>
      // Before this document's first paint, not after the module loads: a
      // transparent iframe whose used colour scheme differs from its
      // embedder's is composited opaque — solid white over a dark host — and
      // the module that sets the scheme properly arrives whole network
      // round-trips after the first paint. Same order of preference as the
      // module's own answer: the address, then the host's mark, then the
      // viewer. Inline `color-scheme` rather than waiting for the stylesheet,
      // which travels with that same module; the module erases the pin once
      // its classes are the authority.
      (() => {
        try {
          const theme = new URLSearchParams(window.location.search).get('theme');
          const known = { light: false, dark: true, contrast: true };
          let dark = known[theme];
          if (dark === undefined && window.parent !== window) {
            try {
              dark = window.parent.document.documentElement.classList.contains('dark');
            } catch {
              // A cross-origin host cannot be asked; fall through.
            }
          }
          if (dark === undefined) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.classList.toggle('dark', Boolean(dark));
          document.documentElement.classList.toggle('contrast', theme === 'contrast');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {
          // A document that cannot answer paints as it would have anyway.
        }
      })();
    </script>
  </head>
  <body data-page="embed" data-asset-base="./upstream">
    <!--
      No loading card. This document is almost always inside the site's demo
      window, and a card of its own in the middle of that window is a second
      piece of chrome saying what the window is already able to say. The host
      is told when the gallery is running (see `statusMessage`) and shows it in
      the window's own title bar; until then this page paints nothing at all,
      so the window's surface is what a reader sees.

      The fallback stays: an example that cannot run has something to say, and
      the demo window keeps showing while it says it.
    -->
    <div class="fallback" id="fallback" hidden>
      <div class="fallback-card"><strong>Live example unavailable</strong><p>The component remains available in native GPUI applications.</p><p data-error></p></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
