[workspace]
resolver = "2"
members = [
    "crates/gpui-ai",
    "crates/gallery",
    "crates/gallery-web",
]
default-members = ["crates/gpui-ai", "crates/gallery", "crates/gallery-web"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false  # the gallery crates are demos; `gpui-ai` overrides this

[workspace.dependencies]
gpui-ai = { path = "crates/gpui-ai" }

# GPUI Kit publishes the whole stack, GPUI included: `gpui-pre` is a snapshot
# of Zed's crate, and the layers move together by semver. The package renames
# keep every `use gpui::`, `use gpui_component::`, and `gpui_component_assets::`
# path in this workspace pointing at the same names it always did.
gpui = { package = "gpui-pre", version = "0.3.3" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.3", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = "0.6.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "0.6.0" }
gpui-base = "0.6.0"

anyhow = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.113"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Gallery performance tuning: the component gallery is the project's
# demonstration surface, so release builds optimize for steady frame times.
# Measured against the catalog-scan gate (npm run test:catalog).
[profile.release]
codegen-units = 16
lto = "thin"

# Browser delivery profile: the whole catalog ships as one WASM binary that
# every visitor downloads before a demo can run, so size wins over compile
# time here. `opt-level = "s"` rather than "z" keeps the loop optimizations the
# animated stories depend on. Used by `npm run build:wasm`; measurements live
# in docs/internal/wasm-baseline.md.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimized development profile: dependency crates (gpui, gpui-component, and
# their stacks) dominate frame-time cost, so they compile with optimizations
# while workspace crates stay unoptimized for fast iteration. Use through
# `npm run dev:fast`. First build recompiles every dependency once.
[profile.dev-fast]
inherits = "dev"

[profile.dev-fast.package."*"]
opt-level = 2
