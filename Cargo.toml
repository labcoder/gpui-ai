[workspace]
resolver = "2"
members = [
    "crates/gpui-ai",
    "crates/gallery",
    "crates/gallery-web",
]
default-members = ["crates/gpui-ai", "crates/gallery", "crates/gallery-web"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false  # all crates stay unpublished while GPUI dependencies come from Git

[workspace.dependencies]
gpui-ai = { path = "crates/gpui-ai" }

# GPUI must come from the Zed repository (the crates.io release is outdated).
# Do NOT add a `rev` field here: gpui-component declares this dependency
# without one, and differing git specs make Cargo duplicate the crate.
# The commit is pinned via Cargo.lock — see "Dependency policy" in AGENTS.md.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }

anyhow = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.113"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Gallery performance tuning: the component gallery is the project's
# demonstration surface, so release builds optimize for steady frame times.
# Measured against the catalog-scan gate (npm run test:catalog).
[profile.release]
codegen-units = 16
lto = "thin"

# Browser delivery profile: the whole catalog ships as one WASM binary that
# every visitor downloads before a demo can run, so size wins over compile
# time here. `opt-level = "s"` rather than "z" keeps the loop optimizations the
# animated stories depend on. Used by `npm run build:wasm`; measurements live
# in docs/internal/wasm-baseline.md.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimized development profile: dependency crates (gpui, gpui-component, and
# their stacks) dominate frame-time cost, so they compile with optimizations
# while workspace crates stay unoptimized for fast iteration. Use through
# `npm run dev:fast`. First build recompiles every dependency once.
[profile.dev-fast]
inherits = "dev"

[profile.dev-fast.package."*"]
opt-level = 2
