name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Linux system dependencies
        run: bash script/install-linux.sh
      - name: Install site dependencies
        # `npm run generate` highlights the Rust snippets with Shiki, which
        # lives in site/node_modules. Without this the freshness check below
        # fails on a clean runner for a reason that has nothing to do with the
        # generated files being stale.
        run: npm ci --prefix site
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format, lint, test, and document
        run: npm run check

  native:
    name: Native compilation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux system dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bash script/install-linux.sh
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check native workspace
        run: npm run check:native

  wasm:
    name: WASM gallery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Functional browser checks use a known Linux WebGPU adapter, not the
      # runner image's changing graphics defaults. Not a performance profile.
      GPUI_AI_WEB_GPU: software
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/gallery-web/www/package-lock.json
            site/package-lock.json
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/setup-web-browser
      # build-wasm.sh deliberately never runs wasm-opt, locally or here:
      # Binaryen 108 and 132 both produced non-instantiable artifacts.
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install web host dependencies
        run: npm ci --prefix crates/gallery-web/www
      - name: Install site dependencies
        # check:site typechecks and build:site runs Vite, both from
        # site/node_modules. Without this a clean runner produces no site.
        run: npm ci --prefix site
      - name: Check web host, site, and test harness
        run: |
          npm --prefix crates/gallery-web/www test
          npm run check:site
      - name: Build the release gallery
        run: |
          npm run build:wasm
          npm --prefix crates/gallery-web/www run build
      - name: Test the built release gallery in the pinned browser
        run: npm run test:web:browser

      - name: Report the WASM size
        run: npm run report:wasm
      - name: Retain the tested gallery for publication assembly
        uses: actions/upload-artifact@v7
        with:
          name: tested-gallery
          path: crates/gallery-web/www/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser-evidence
          path: ${{ runner.temp }}/gpui-ai-web-evidence/
          retention-days: 7
          overwrite: true

  pages-build:
    name: Assemble publishable site
    needs: [quality, native, wasm]
    # Expensive posters/docs/site work begins only after every CI gate passes.
    # Tags get a complete artifact too, but only main pushes auto-deploy it.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    uses: ./.github/workflows/build-site.yml
    with:
      source-sha: ${{ github.sha }}
      gallery-artifact: tested-gallery
