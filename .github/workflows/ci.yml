name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A tag is the one build nothing else follows, so it is the one that runs
    # everything — see the capture steps in the WASM gallery job.
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Linux system dependencies
        run: bash script/install-linux.sh
      - name: Install site dependencies
        # `npm run generate` highlights the Rust snippets with Shiki, which
        # lives in site/node_modules. Without this the freshness check below
        # fails on a clean runner for a reason that has nothing to do with the
        # generated files being stale.
        run: npm ci --prefix site
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format, lint, test, and document
        run: npm run check
      - name: Generated files are current
        run: |
          npm run generate
          git diff --exit-code

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux system dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bash script/install-linux.sh
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check native workspace
        run: npm run check:native

  wasm:
    name: WASM gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/gallery-web/www/package-lock.json
            site/package-lock.json
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      # No binaryen step on purpose. `wasm-opt -Oz -all` shrinks the artifact
      # from 16.9 MB to 14.4 MB and produces a module the browser cannot
      # instantiate — with Ubuntu's binaryen 108 and equally with a pinned
      # upstream 132, so it is not version skew. The same artifact without
      # wasm-opt passes the release browser gate. build-wasm.sh still runs
      # wasm-opt when it is on PATH, so re-enabling this is one step away once
      # the incompatibility is understood; see docs/internal/wasm-baseline.md.
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install web host dependencies
        run: npm ci --prefix crates/gallery-web/www
      - name: Install site dependencies
        # check:site typechecks and build:site runs Vite, both from
        # site/node_modules. Without this a clean runner produces no site.
        run: npm ci --prefix site
      - name: Test the shared gallery artifact
        run: |
          npm run check:web
          npm run build:wasm

      # Two ways to build the site, differing only in whether the seventy
      # posters and forty-three social cards are rendered. They cost about
      # seven minutes of a browser drawing every story twice, and they are
      # ordered around the site build rather than appended to it — the posters
      # have to exist before Vite copies `site/public`, and the cards are
      # rendered out of the built site's own stylesheet — so this is two paths
      # rather than one path and an extra step.
      #
      # Skipped on a push to main because the Pages workflow runs the same
      # captures on the same commit minutes later, and on a pull request
      # because nothing deploys from one. Neither is a gap: the release gate
      # captures two posters and two cards on every run, which is what proves
      # the machinery, and a story that stopped drawing fails that gate.
      - name: Build the site
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          npm --prefix crates/gallery-web/www run build
          npm run build:site

      - name: Build the site, with every poster and social card
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build:web

      - name: Report the WASM size
        run: npm run report:wasm
