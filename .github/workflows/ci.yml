name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux system dependencies
        run: bash script/install-linux.sh
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format, lint, test, and document
        run: npm run check
      - name: Generated files are current
        run: |
          npm run generate
          git diff --exit-code

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux system dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bash script/install-linux.sh
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check native workspace
        run: npm run check:native

  wasm:
    name: WASM gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gallery-web/www/package-lock.json
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install binaryen
        # Pinned to an upstream release rather than apt: Ubuntu ships binaryen
        # 108 (2022), which accepts today's rustc output and silently produces
        # a module the browser cannot instantiate. The release browser gate
        # below is what caught it. Bump this deliberately, and let that gate
        # prove the artifact still runs.
        env:
          BINARYEN_VERSION: version_132
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        run: |
          set -euo pipefail
          archive="binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${archive}"
          echo "${BINARYEN_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}"
          echo "${PWD}/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Confirm binaryen is new enough for this toolchain
        run: wasm-opt --version
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install web host dependencies
        run: npm ci --prefix crates/gallery-web/www
      - name: Test and build the shared gallery artifact
        run: |
          npm run check:web
          npm run build:wasm
          npm run build:web
          npm run report:wasm
