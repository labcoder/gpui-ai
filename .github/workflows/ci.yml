name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A tag is the one build nothing else follows, so it is the one that runs
    # everything — see the capture steps in the WASM gallery job.
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Linux system dependencies
        run: bash script/install-linux.sh
      - name: Install site dependencies
        # `npm run generate` highlights the Rust snippets with Shiki, which
        # lives in site/node_modules. Without this the freshness check below
        # fails on a clean runner for a reason that has nothing to do with the
        # generated files being stale.
        run: npm ci --prefix site
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format, lint, test, and document
        run: npm run check
      - name: Generated files are current
        run: |
          npm run generate
          git diff --exit-code

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux system dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bash script/install-linux.sh
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: native-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check native workspace
        run: npm run check:native

  wasm:
    name: WASM gallery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Functional browser checks use a known Linux WebGPU adapter, not the
      # runner image's changing graphics defaults. Not a performance profile.
      GPUI_AI_WEB_GPU: software
      # Ubuntu restricts user namespaces for downloaded Chrome binaries. Use
      # the runner's installed sandbox helper, not --no-sandbox or a sysctl.
      CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
    steps:
      - uses: actions/checkout@v7
      - name: Set browser evidence paths
        # Runtime runner paths are not available in job-level env expressions.
        # Keep evidence outside the Cargo cache so old runs cannot be uploaded.
        run: |
          echo "GPUI_AI_WEB_EVIDENCE_ROOT=$RUNNER_TEMP/gpui-ai-web-evidence" >> "$GITHUB_ENV"
          echo "GPUI_AI_WEB_ARTIFACTS=$RUNNER_TEMP/gpui-ai-web-evidence/captures" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/gallery-web/www/package-lock.json
            site/package-lock.json
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install the pinned test browser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
          test -u "$CHROME_DEVEL_SANDBOX"
          npm run setup:web-browser
      # build-wasm.sh deliberately never runs wasm-opt, locally or here:
      # Binaryen 108 and 132 both produced non-instantiable artifacts.
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install web host dependencies
        run: npm ci --prefix crates/gallery-web/www
      - name: Install site dependencies
        # check:site typechecks and build:site runs Vite, both from
        # site/node_modules. Without this a clean runner produces no site.
        run: npm ci --prefix site
      - name: Check web host, site, and test harness
        run: |
          npm --prefix crates/gallery-web/www test
          npm run check:site
      - name: Build the release gallery
        run: |
          npm run build:wasm
          npm --prefix crates/gallery-web/www run build
      - name: Test the built release gallery in the pinned browser
        run: npm run test:web:browser

      # Two ways to build the site, differing only in whether the seventy
      # posters and forty-three social cards are rendered. They cost about
      # seven minutes of a browser drawing every story twice, and they are
      # ordered around the site build rather than appended to it — the posters
      # have to exist before Vite copies `site/public`, and the cards are
      # rendered out of the built site's own stylesheet — so this is two paths
      # rather than one path and an extra step.
      #
      # Full image generation is skipped on branches/PRs: the release gate
      # captures representative posters/cards and smoke-tests every story and
      # declared variant. Tags and Pages additionally render all the images.
      - name: Build the site
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run build:site

      - name: Build the site, with every poster and social card
        if: startsWith(github.ref, 'refs/tags/')
        # Reuse the artifact just tested; do not rebuild it after the gate.
        run: |
          npm run generate:posters
          npm run build:site
          npm run generate:og

      - name: Report the WASM size
        run: npm run report:wasm
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser-evidence
          path: ${{ runner.temp }}/gpui-ai-web-evidence/
          retention-days: 7
