name: Pages

on:
  push:
    branches: [main]
  # Pages has to be switched on by hand first (C-04). A manual trigger means
  # the first live deploy does not need an empty commit to provoke it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages mints its deployment credential from an OIDC token.
  id-token: write

# Deliberately not ci.yml's group. The contended resource is the one live site,
# not the branch, and a deploy already handing files to the CDN has to finish
# rather than be cancelled by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Its `base_path` output goes unused — site/vite.config.ts hardcodes
      # `/gpui-ai/`. It is here, and this early, because it fails by name when
      # Pages is not enabled for the repository, instead of letting the whole
      # build run and then fail at the deploy.
      - uses: actions/configure-pages@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/gallery-web/www/package-lock.json
            site/package-lock.json
      - name: Install Linux system dependencies
        # ci.yml's WASM job needs none of these because nothing there links for
        # the host. This job also runs the catalog export and rustdoc, which
        # build GPUI natively.
        run: bash script/install-linux.sh
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: pages-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      # No binaryen step here either, for the reason ci.yml records at its own
      # WASM job: `wasm-opt -Oz -all` returns a module the browser cannot
      # instantiate. Publishing a gallery that fails to start would be worse
      # than publishing a large one.
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install web host dependencies
        run: npm ci --prefix crates/gallery-web/www
      - name: Install site dependencies
        # `npm run generate` highlights with Shiki and the site build runs Vite,
        # both from site/node_modules, so this precedes either of them.
        run: npm ci --prefix site
      - name: Generate the site data
        # The generated files are tracked and ci.yml gates their freshness, but
        # that gate lives in another workflow and runs alongside this one.
        # Regenerating here is what makes the published site match the commit it
        # was built from, whatever state the checked-in copies are in.
        run: npm run generate
      - name: Build the API documentation
        # Ahead of the gallery on purpose: build-docs.mjs fails when a
        # catalogued component has no rustdoc page, and that is worth hearing in
        # a couple of minutes rather than after the fat-LTO WASM build.
        run: npm run build:docs
      - name: Build the shared gallery artifact and the site
        # build:web renders the posters between the gallery build and the site
        # build, and the social cards after it: both need a browser, and both
        # are derived output rather than checked-in files.
        run: |
          npm run build:wasm
          npm run build:web
          npm run report:wasm
      - name: Copy the API documentation into the site
        # site/scripts/build.mjs promotes a staging directory onto site/dist by
        # rename, so anything written there beforehand is discarded — this has
        # to follow the site build. `api/` is the path site/app/links.ts gives
        # every rustdoc link, masthead and footer included.
        run: |
          mkdir -p site/dist/api
          cp -r target/doc/. site/dist/api/
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
