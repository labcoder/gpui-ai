name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Recovery path: explicitly rebuild and test main without waiting on CI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  source:
    name: Select trusted publication
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run-id: ${{ steps.source.outputs.run-id }}
    steps:
      - name: Reject superseded runs
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run?.head_sha ?? context.sha;
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (sha !== branch.commit.sha) {
              core.notice('Skipping superseded publication; main has moved.');
              return;
            }
            core.setOutput('sha', sha);
            core.setOutput('run-id', String(run?.id ?? context.runId));

  manual:
    name: Standalone build
    needs: source
    if: github.event_name == 'workflow_dispatch' && needs.source.outputs.sha != ''
    uses: ./.github/workflows/build-site.yml
    with:
      source-sha: ${{ needs.source.outputs.sha }}

  prepare:
    name: Import verified publication
    needs: [source, manual]
    if: >-
      always() && !cancelled() && needs.source.outputs.sha != '' &&
      ((github.event_name == 'workflow_run' && needs.manual.result == 'skipped') ||
      (github.event_name == 'workflow_dispatch' && needs.manual.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
    outputs:
      artifact-name: ${{ format('github-pages-{0}', github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/configure-pages@v6
      - name: Download only the selected run's artifact
        uses: actions/download-artifact@v8
        with:
          name: pages-site
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pages-site
      - name: Verify source, run, and file hashes
        env:
          SITE_SHA: ${{ needs.source.outputs.sha }}
          SITE_RUN_ID: ${{ needs.source.outputs.run-id }}
        run: node script/pages-artifact.mjs verify "$RUNNER_TEMP/pages-site"
      - name: Package the verified bytes for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          # Artifact names are immutable within a run. A packaging retry must
          # not collide, and deploy-only retries retain this job's output.
          name: ${{ format('github-pages-{0}', github.run_attempt) }}
          path: ${{ runner.temp }}/pages-site
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: [source, prepare]
    # The optional manual ancestor is skipped on automatic runs. Override
    # skipped-ancestor propagation without allowing a failed import to deploy.
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a run superseded while waiting for deployment
        id: current
        uses: actions/github-script@v8
        env:
          SITE_SHA: ${{ needs.source.outputs.sha }}
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            core.setOutput('current', String(branch.commit.sha === process.env.SITE_SHA));
      - name: Deploy the verified artifact
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.prepare.outputs.artifact-name }}
